name: Pull request CI
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  # allows manual trigger from actions page
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Run Maven build
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Install Playwright Chromium
        run: ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"

      - name: Run Playwright E2E tests
        run: ./mvnw --batch-mode --no-transfer-progress -Pe2e test

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build app
