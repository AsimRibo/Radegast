services:
  database:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/db_init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test:  [
        "CMD-SHELL",
        "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: radegast-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: radegast-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  app:
    image: ${RADEGAST_IMAGE}

    build:
      context: .
      dockerfile: Dockerfile

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"

    ports:
      - "${APP_PORT}:8080"

    depends_on:
      database:
          condition: service_healthy

    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data: