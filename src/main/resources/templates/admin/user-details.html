<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>User details</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasRole('ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit"
                    class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div th:if="${successMessage}"
         class="alert app-info-alert admin-user-card mx-auto"
         role="alert"
         th:text="${successMessage}">
    </div>
    <div class="card app-content-card admin-user-card mx-auto">
        <div class="card-body p-4">
            <div class="mb-4">
                <p class="section-label mb-1">USER MANAGEMENT</p>
                <h1 class="h3 mb-2"
                    th:text="${user.firstName + ' ' + user.lastName}">
                </h1>
                <p class="text-muted mb-0"
                   th:text="${user.email}">
                </p>
            </div>
            <dl class="row mb-4">
                <dt class="col-sm-4">Role</dt>
                <dd class="col-sm-8"
                    th:text="${user.role}">
                </dd>
                <dt class="col-sm-4">Account status</dt>
                <dd class="col-sm-8">
                    <span class="badge"
                          th:classappend="${user.active}
                            ? ' app-user-status-active'
                            : ' app-user-status-inactive'"
                          th:text="${user.active}
                            ? 'Active'
                            : 'Inactive'">
                    </span>
                </dd>
            </dl>
            <div class="d-flex flex-wrap gap-2">
                <form th:if="${user.active}"
                      th:action="@{/admin/users/{id}/deactivate(id=${user.id})}"
                      method="post">
                    <button
                            type="submit"
                            class="btn app-primary-button">
                        Deactivate account
                    </button>
                </form>
                <form
                        th:unless="${user.active}"
                        th:action="@{/admin/users/{id}/activate(id=${user.id})}"
                        method="post">
                    <button
                            type="submit"
                            class="btn app-primary-button">
                        Activate account
                    </button>
                </form>
                <a class="btn app-secondary-button"
                   th:href="@{/admin/users}">
                    Back to users
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
