<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}"></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
            <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/courses}">
                Courses
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit" class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <h1 class="mb-4" th:text="${formTitle}"></h1>
    <form th:action="${formAction}" th:object="${assessmentForm}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input id="title" type="text" th:field="*{title}" class="form-control">
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
        </div>
        <div class="mb-3">
            <label for="assessmentType" class="form-label">Type</label>
            <select id="assessmentType" th:field="*{assessmentType}" class="form-select">
                <option value="">Select assessment type</option>
                <option value="ASSIGNMENT">Assignment</option>
                <option value="QUIZ">Quiz</option>
            </select>
            <div th:if="${#fields.hasErrors('assessmentType')}" th:errors="*{assessmentType}" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="maximumScore" class="form-label">Maximum score</label>
            <input id="maximumScore" type="number" th:field="*{maximumScore}" min="1" step="1" class="form-control">
            <div th:if="${#fields.hasErrors('maximumScore')}" th:errors="*{maximumScore}" class="text-danger"></div>
        </div>
        <div class="mb-3">
            <label for="dueAt" class="form-label">Due date</label>
            <input id="dueAt" type="datetime-local" th:field="*{dueAt}" class="form-control">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="${submitLabel}"></button>
            <a th:href="@{/courses/{courseId}/assessments(courseId=${courseId})}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </form>
</main>
</body>
</html>
