<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Grade assessment</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
            <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/courses}">
                Courses
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit" class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div class="mb-4">
        <h1 th:text="${assessment.title}"></h1>
        <p class="text-muted mb-1">
            Maximum score: <span th:text="${assessment.maximumScore}"></span>
        </p>
        <p class="text-muted" th:if="${assessment.dueAt != null}">
            Due: <span th:text="${#temporals.format(assessment.dueAt, 'dd.MM.yyyy HH:mm')}"></span>
        </p>
    </div>
    <div th:if="${message}"
         class="alert alert-success"
         th:text="${message}">
    </div>
    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>
    <div th:if="${#lists.isEmpty(students)}" class="alert alert-secondary">
        No enrolled students.
    </div>
    <div th:each="student : ${students}" class="border rounded p-3 mb-3">
        <form th:action="@{/courses/assessments/{assessmentId}/grades(assessmentId=${assessment.id})}" method="post">
            <input type="hidden"
                   name="studentId"
                   th:value="${student.studentId}">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label">Student</label>
                    <div class="form-control-plaintext" th:text="${student.studentName}"></div>
                </div>
                <div class="col-md-2">
                    <label for="gradeScore" class="form-label">Score</label>
                    <div class="input-group">
                        <input
                                id="gradeScore"
                                type="number"
                                name="score"
                                class="form-control"
                                min="0"
                                th:max="${assessment.maximumScore}"
                                th:value="${student.score}"
                                required>
                        <span class="input-group-text" th:text="${'/ ' + assessment.maximumScore}"></span>
                    </div>
                </div>
                <div class="col-md-5">
                    <label for="feedback" class="form-label">Feedback</label>
                    <textarea
                            id="feedback"
                            name="feedback"
                            class="form-control"
                            rows="2"
                            th:text="${student.feedback}">
                    </textarea>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        Save
                    </button>
                </div>
            </div>
        </form>
    </div>
    <a th:href="@{/courses/{courseId}/assessments(courseId=${assessment.course.id})}" class="btn btn-secondary">
        Back to assessments
    </a>
</main>
</body>
</html>
