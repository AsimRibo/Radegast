<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Assessments</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
            <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/courses}">
                Courses
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit" class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Assessments</h1>
        <a th:href="@{/courses/{courseId}/assessments/new(courseId=${courseId})}" class="btn btn-primary">
            New assessment
        </a>
    </div>
    <table class="table" th:if="${!assessments.isEmpty()}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Type</th>
            <th>Maximum score</th>
            <th>Due</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="assessment : ${assessments}">
            <td th:text="${assessment.title}"></td>
            <td th:text="${assessment.assessmentType}"></td>
            <td th:text="${assessment.maximumScore}"></td>
            <td th:text="${assessment.dueAt != null ? #temporals.format(assessment.dueAt, 'dd.MM.yyyy HH:mm') : 'No due'}"></td>
            <td>
                <a th:href="@{/courses/{courseId}/assessments/{assessmentId}/edit(courseId=${courseId}, assessmentId=${assessment.id})}"
                   class="btn btn-sm btn-outline-secondary">
                    Edit
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${assessments.isEmpty()}" class="text-muted">
        No assessments have been created.
    </p>
    <a th:href="@{/courses}" class="btn btn-outline-secondary">Back to courses</a>
</main>
</body>
</html>
