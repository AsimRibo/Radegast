<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
            <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/courses}">
                Courses
            </a>
            <a sec:authorize="hasAuthority('ROLE_STUDENT')"
               th:href="@{/student/courses}"
               class="app-link">
                Courses
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit"
                    class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="mb-1">
                Courses
            </h1>
            <p class="text-muted mb-0" th:if="${showTeacherColumn}">
                View all courses.
            </p>
            <p class="text-muted mb-0" th:unless="${showTeacherColumn}">
                View and manage your courses.
            </p>
        </div>
        <a th:if="${canCreateCourse}"
           th:href="@{/courses/new}"
           class="btn btn-primary">
            Create course
        </a>
    </div>
    <div th:if="${successMessage}"
         class="alert alert-success"
         role="alert"
         th:text="${successMessage}">
    </div>
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">
                            Code
                        </th>
                        <th scope="col">
                            Name
                        </th>
                        <th scope="col"
                            th:if="${showTeacherColumn}">
                            Teacher
                        </th>
                        <th scope="col">
                            Status
                        </th>
                        <th scope="col">
                            Capacity
                        </th>
                        <th scope="col">
                            Enrollment
                        </th>
                        <th scope="col">
                            Actions
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td class="text-center text-muted py-4"
                            th:attr="colspan=${showTeacherColumn ? 7 : 6}">
                            No courses have been created yet.
                        </td>
                    </tr>
                    <tr th:each="course : ${courses}">
                        <td>
                            <span class="fw-semibold"
                                  th:text="${course.code}">
                            </span>
                        </td>

                        <td>
                            <div class="fw-semibold"
                                 th:text="${course.name}">
                            </div>

                            <div class="small text-muted"
                                 th:if="${course.description != null}"
                                 th:text="${course.description}">
                            </div>
                        </td>

                        <td th:if="${showTeacherColumn}">
                            <span th:if="${course.teacherName != null}"
                                  th:text="${course.teacherName}">
                            </span>
                            <span th:if="${course.teacherName == null}" class="text-muted">
                                Unassigned
                            </span>
                        </td>
                        <td>
                            <span class="badge text-bg-secondary"
                                  th:text="${course.status}">
                            </span>
                        </td>
                        <td>
                            <span th:if="${course.capacity != null}"
                                  th:text="${course.capacity}">
                            </span>
                            <span th:if="${course.capacity == null}"
                                  class="text-muted">
                                Unlimited
                            </span>
                        </td>
                        <td>
                            <span th:if="${course.enrollmentOpen}"
                                  class="badge text-bg-success">
                                Open
                            </span>
                            <span th:unless="${course.enrollmentOpen}"
                                  class="badge text-bg-secondary">
                                Closed
                            </span>
                        </td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a th:href="@{/courses/{id}/assessments(id=${course.id})}" class="btn btn-sm btn-outline-secondary">
                                    Assessments
                                </a>
                                <a th:href="@{/courses/{courseId}/enrollments(courseId=${course.id})}"
                                   class="btn btn-sm app-secondary-button">
                                    Enrolments
                                </a>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/courses/{courseId}/sessions(courseId=${course.id})}">
                                    Sessions
                                </a>
                                <a th:if="${course.status.name() != 'ARCHIVED'}"
                                   class="btn btn-sm app-secondary-button"
                                   th:href="@{/courses/{id}/edit(id=${course.id})}">
                                    Edit
                                </a>
                                <form th:if="${course.status.name() == 'DRAFT'}"
                                      method="post"
                                      th:action="@{/courses/{id}/activate(id=${course.id})}"
                                      class="mb-0">
                                    <button type="submit"
                                            class="btn btn-sm app-primary-button">
                                        Activate
                                    </button>
                                </form>

                                <form th:if="${course.status.name() == 'ACTIVE'}"
                                      method="post"
                                      th:action="@{/courses/{id}/deactivate(id=${course.id})}"
                                      class="mb-0">
                                    <button type="submit"
                                            class="btn btn-sm app-secondary-button">
                                        Return to draft
                                    </button>
                                </form>
                                <form th:if="${course.status.name() != 'ARCHIVED'}"
                                      method="post"
                                      th:action="@{/courses/{id}/archive(id=${course.id})}"
                                      class="mb-0">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger">
                                        Archive
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
