<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${course.name + ' sessions'}"></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
            <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/courses}">
                Courses
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit" class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div th:if="${successMessage != null}"
         class="alert alert-success"
         role="alert"
         th:text="${successMessage}">
    </div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <p class="text-muted mb-1">
                Course sessions
            </p>
            <h1 class="h3 mb-0"
                th:text="${course.code + ' - ' + course.name}">
            </h1>
        </div>
        <a th:if="${canManage and course.status.name() != 'ARCHIVED'}"
           class="btn app-primary-button"
           th:href="@{/courses/{courseId}/sessions/new(courseId=${course.id})}">
            Schedule session
        </a>
    </div>
    <div th:if="${course.status.name() == 'ARCHIVED'}"
         class="alert alert-secondary"
         role="alert">
        This course is archived. Its sessions are read-only.
    </div>
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">
                        Topic
                    </th>
                    <th scope="col">
                        Starts
                    </th>
                    <th scope="col">
                        Ends
                    </th>
                    <th scope="col">
                        Location
                    </th>
                    <th scope="col">
                        Status
                    </th>
                    <th th:if="${canManage}"
                        scope="col">
                        Actions
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(sessions)}">
                    <td class="text-center text-muted py-4"
                        th:attr="colspan=${canManage ? 6 : 5}">
                        No sessions are currently scheduled.
                    </td>
                </tr>
                <tr th:each="courseSession : ${sessions}">
                    <td>
                        <span th:if="${courseSession.topic != null}"
                              th:text="${courseSession.topic}">
                        </span>

                        <span th:if="${courseSession.topic == null}"
                              class="text-muted">
                            No topic
                        </span>
                    </td>
                    <td th:text="${courseSession.startsAt}">
                    </td>
                    <td th:text="${courseSession.endsAt}">
                    </td>
                    <td>
                        <span th:if="${courseSession.location != null}"
                              th:text="${courseSession.location}">
                        </span>
                        <span th:if="${courseSession.location == null}"
                              class="text-muted">
                            Not specified
                        </span>
                    </td>
                    <td>
                        <span th:if="${not courseSession.cancelled}"
                              class="badge text-bg-success">
                            Scheduled
                        </span>

                        <span th:if="${courseSession.cancelled}"
                              class="badge text-bg-danger">
                            Cancelled
                        </span>
                    </td>
                    <td th:if="${canManage}">
                        <div th:if="${not courseSession.cancelled and course.status.name() != 'ARCHIVED'}"
                             class="d-flex flex-wrap gap-2">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/courses/{courseId}/sessions/{sessionId}/edit(courseId=${course.id}, sessionId=${courseSession.id})}">
                                Edit
                            </a>
                            <form method="post"
                                  th:action="@{/courses/{courseId}/sessions/{sessionId}/cancel(courseId=${course.id}, sessionId=${courseSession.id})}"
                                  class="mb-0">
                                <button type="submit"
                                        class="btn btn-sm btn-outline-danger">
                                    Cancel
                                </button>
                            </form>
                        </div>
                        <span th:if="${courseSession.cancelled or course.status.name() == 'ARCHIVED'}"
                              class="text-muted">
                            No actions
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="mt-4">
        <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
           class="btn app-secondary-button"
           th:href="@{/courses}">
            Back to courses
        </a>
        <a sec:authorize="hasAuthority('ROLE_STUDENT')"
           class="btn app-secondary-button"
           th:href="@{/dashboard}">
            Back to dashboard
        </a>
    </div>
</main>
</body>
</html>
