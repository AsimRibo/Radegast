<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radegast</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container">
        <span class="navbar-brand fw-semibold mb-0">
            Radegast
        </span>
    </div>
</nav>
<main class="container py-5">
    <div class="registration-card mx-auto">
        <header class="mb-4">
            <p class="section-label mb-2">
                CREATE ACCOUNT
            </p>

            <h1 class="h3 mb-2">
                Register for Radegast
            </h1>

            <p class="text-secondary mb-0">
                Create a student or teacher account.
            </p>
        </header>

        <form method="post"
              th:action="@{/register}"
              th:object="${registerUserDto}"
              novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="firstName"
                           class="form-label">
                        First name
                    </label>

                    <input id="firstName"
                           type="text"
                           class="form-control"
                           th:field="*{firstName}"
                           th:classappend="
                                ${#fields.hasErrors('firstName')}
                                ? 'is-invalid'
                            "
                           autocomplete="given-name">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('firstName')}"
                         th:errors="*{firstName}">
                        First name error
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="lastName"
                           class="form-label">
                        Last name
                    </label>

                    <input id="lastName"
                           type="text"
                           class="form-control"
                           th:field="*{lastName}"
                           th:classappend="
                                ${#fields.hasErrors('lastName')}
                                ? 'is-invalid'
                            "
                           autocomplete="family-name">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('lastName')}"
                         th:errors="*{lastName}">
                        Last name error
                    </div>
                </div>

                <div class="col-12">
                    <label for="email"
                           class="form-label">
                        Email
                    </label>

                    <input id="email"
                           type="email"
                           class="form-control"
                           th:field="*{email}"
                           th:classappend="
                                ${#fields.hasErrors('email')}
                                ? 'is-invalid'
                            "
                           autocomplete="email">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                        Email error
                    </div>
                </div>

                <div class="col-12">
                    <label for="password"
                           class="form-label">
                        Password
                    </label>

                    <input id="password"
                           type="password"
                           class="form-control"
                           th:field="*{password}"
                           th:classappend="
                                ${#fields.hasErrors('password')}
                                ? 'is-invalid'
                            "
                           autocomplete="new-password">

                    <div class="form-text">
                        Use between 8 and 64 characters.
                    </div>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                        Password error
                    </div>
                </div>

                <div class="col-12">
                    <label for="role"
                           class="form-label">
                        Account type
                    </label>

                    <select id="role"
                            class="form-select"
                            th:field="*{role}"
                            th:classappend="
                                ${#fields.hasErrors('role')}
                                ? 'is-invalid'
                            ">
                        <option value="">
                            Select an account type
                        </option>

                        <option value="STUDENT">
                            Student
                        </option>

                        <option value="TEACHER">
                            Teacher
                        </option>
                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('role')}"
                         th:errors="*{role}">
                        Role error
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <button type="submit"
                            class="btn app-primary-button w-100">
                        Create account
                    </button>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
