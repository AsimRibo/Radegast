<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${course.name} + ' sessions'"></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar app-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-4">
            <span class="navbar-brand fw-semibold mb-0">
                Radegast
            </span>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/admin/users}">
                Manage users
            </a>
            <a sec:authorize="hasAnyAuthority('ROLE_TEACHER', 'ROLE_ADMIN')"
               class="nav-link app-link"
               th:href="@{/courses}">
                Courses
            </a>
            <a sec:authorize="hasAuthority('ROLE_STUDENT')"
               th:href="@{/student/courses}"
               class="app-link">
                Courses
            </a>
        </div>
        <form method="post"
              th:action="@{/logout}"
              class="mb-0">
            <button type="submit"
                    class="btn btn-sm app-secondary-button">
                Log out
            </button>
        </form>
    </div>
</nav>
<main class="container py-4">
    <section class="app-content-card p-4">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
            <div>
                <p class="section-label mb-1" th:text="${course.code}">
                </p>
                <h1 class="h3 mb-2" th:text="${course.name}">
                </h1>
                <p class="text-muted mb-1">
                    Teacher: <span th:text="${course.teacherName}"></span>
                </p>
                <p th:if="${course.description != null and !course.description.isBlank()}"
                   class="text-muted mb-0"
                   th:text="${course.description}">
                </p>
            </div>
            <a th:href="@{/student/courses}" class="btn app-secondary-button">
                Back to courses
            </a>
        </div>
        <div th:if="${#lists.isEmpty(course.sessions)}" class="app-info-alert">
            No sessions have been scheduled for this course.
        </div>
        <div th:unless="${#lists.isEmpty(course.sessions)}" class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>Topic</th>
                    <th>Starts</th>
                    <th>Ends</th>
                    <th>Location</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="courseSession : ${course.sessions}">
                    <td th:text="${courseSession.topic}"></td>
                    <td th:text="${#temporals.format(courseSession.startsAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(courseSession.endsAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${courseSession.location}"></td>
                    <td>
                        <span th:if="${courseSession.cancelled}" class="badge text-bg-danger">
                            Cancelled
                        </span>
                        <span th:unless="${courseSession.cancelled}" class="badge text-bg-success">
                            Scheduled
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
